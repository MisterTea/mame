name: Build

on:
    workflow_dispatch:
    push:
        branches: [master, mamehub, mamehub_libretro, mamehub_discord]
    pull_request:
        branches: [master, mamehub, mamehub_libretro, mamehub_discord]

jobs:
    build_linux:
        runs-on: ubuntu-22.04

        steps:
            - name: Update OS
              run: sudo apt update -y && sudo apt-get install -y git build-essential python3 libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libpulse-dev qtbase5-dev qtbase5-dev-tools qt5-qmake p7zip-full libsodium-dev

            - uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  path: "mame"

            - name: make
              run: pushd mame && make -j2 && rm -Rf build .git src 3rdparty && ./mamehub -cc && mv mame.ini mame.ini.sample && popd

            - name: Upload mame binary
              uses: actions/upload-artifact@v4
              with:
                  # Artifact name
                  name: mamehub_ubuntu_beta
                  # A file, directory or wildcard pattern that describes what to upload
                  path: mame/*

    build_mac:
        runs-on: macos-latest

        steps:
            - name: Update OS
              run: brew install sdl2 sdl2_ttf openssl

            - uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  path: "mame"

            - name: make mame
              run: pushd mame && make USE_LIBSDL=1 VERBOSE=1 -j2 && rm -Rf build .git src 3rdparty && ./mamehub -cc && mv mame.ini mame.ini.sample && popd

            - name: Upload mame binary
              uses: actions/upload-artifact@v4
              with:
                  # Artifact name
                  name: mamehub_mac_beta
                  # A file, directory or wildcard pattern that describes what to upload
                  path: mame/*

    build_windows:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  path: "mame"

            - uses: actions/checkout@v4
              with:
                  repository: jedisct1/libsodium
                  ref: stable
                  path: "libsodium"
            
            - name: Install OpenSSL Full
              run: choco install openssl

            - uses: msys2/setup-msys2@v2
              with:
                  update: true
            - shell: msys2 {0}
              run: |
                  pacman -Syu --noconfirm make mingw-w64-x86_64-python mingw-w64-x86_64-qt5 wget mingw-w64-x86_64-gcc
                  #wget -P /tmp  http://repo.msys2.org/mingw/x86_64/mingw-w64-x86_64-gcc-libs-9.3.0-2-any.pkg.tar.xz
                  #wget -P /tmp  http://repo.msys2.org/mingw/x86_64/mingw-w64-x86_64-gcc-9.3.0-2-any.pkg.tar.xz
                  #pacman -U --noconfirm /tmp/*.tar.xz
                  pushd libsodium && ./configure --enable-static --disable-shared && make && make install && popd
                  pushd mame && MINGW64=/mingw64 make -j2 VERBOSE=1 && rm -Rf build .git src 3rdparty && ./mamehub.exe -cc && mv mame.ini mame.ini.sample && popd

            - name: Upload mame binary
              uses: actions/upload-artifact@v4
              with:
                  # Artifact name
                  name: mamehub_windows_gcc_beta
                  # A file, directory or wildcard pattern that describes what to upload
                  path: mame/*

    build_windows_msvc:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  path: "mame"

            - uses: actions/checkout@v4
              with:
                  repository: jedisct1/libsodium
                  ref: stable
                  path: "libsodium"

            - name: Install OpenSSL Full
              run: choco install openssl

            - name: Add msbuild to PATH
              uses: microsoft/setup-msbuild@v2

            - uses: msys2/setup-msys2@v2
              with:
                  update: true

            - shell: msys2 {0}
              run: |
                  pacman -Syu --noconfirm make mingw-w64-x86_64-python mingw-w64-x86_64-qt5 wget mingw-w64-x86_64-gcc
                  #wget -P /tmp  http://repo.msys2.org/mingw/x86_64/mingw-w64-x86_64-gcc-libs-9.3.0-2-any.pkg.tar.xz
                  #wget -P /tmp  http://repo.msys2.org/mingw/x86_64/mingw-w64-x86_64-gcc-9.3.0-2-any.pkg.tar.xz
                  #pacman -U --noconfirm /tmp/*.tar.xz
                  pushd libsodium && ./configure --enable-static --disable-shared && make && make install && popd
                  pushd mame && MINGW64=/mingw64 make -j2 MSBUILD=1 VERBOSE=1 && rm -Rf build .git src 3rdparty && ./mamehub.exe -cc && mv mame.ini mame.ini.sample && popd

            - name: Upload mame binary
              uses: actions/upload-artifact@v4
              with:
                  # Artifact name
                  name: mamehub_windows_msvc_beta
                  # A file, directory or wildcard pattern that describes what to upload
                  path: mame/*
