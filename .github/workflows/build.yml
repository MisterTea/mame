name: Build

# Object cache is mame/build (generated Makefiles + .o). REGENIE only re-runs
# GENie; turn it on when makefile/scripts/genie/this workflow hash differs from
# build/.genie-input-hash. Ordinary .cpp/.h edits keep REGENIE=0 so make does
# not rewrite $(MAKEFILE) and treat every object as stale.

on:
    workflow_dispatch:
    push:
        branches: [master, mamehub, mamehub_libretro, mamehub_discord, mamehub_android_discord]
    pull_request:
        branches: [master, mamehub, mamehub_libretro, mamehub_discord, mamehub_android_discord]

jobs:
    build_linux:
        runs-on: ubuntu-22.04

        steps:
            - name: Update OS
              run: sudo apt update -y && sudo apt-get install -y git build-essential python3 libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libpulse-dev qt6-base-dev qt6-base-dev-tools p7zip-full libsodium-dev ccache

            - uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  path: "mame"

            - name: Cache compiler output
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: ${{ github.job }}-${{ runner.os }}
                  restore-keys: ${{ github.job }}-${{ runner.os }}
                  max-size: 4G
                  create-symlink: true
                  verbose: 1

            - name: Restore object cache
              id: obj-cache
              uses: actions/cache/restore@v4
              with:
                  path: mame/build
                  key: mamehub-obj-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
                  restore-keys: |
                      mamehub-obj-${{ runner.os }}-${{ github.job }}-

            - name: Restore source mtimes
              if: steps.obj-cache.outputs.cache-matched-key != ''
              working-directory: mame
              run: python3 scripts/mamehub/ci_restore_mtimes.py

            - name: make
              env:
                  OVERRIDE_CC: ccache gcc
                  OVERRIDE_CXX: ccache g++
                  GENIE_INPUT_HASH: ${{ hashFiles('mame/makefile', 'mame/scripts/**', 'mame/3rdparty/genie/src/**', 'mame/.github/workflows/build.yml') }}
              run: |
                  set -euo pipefail
                  cd mame
                  extra=($(bash scripts/mamehub/ci_regenie_args.sh))
                  make -j4 "${extra[@]}"
                  bash scripts/mamehub/ci_regenie_args.sh --stamp
                  cp 3rdparty/discord_social_sdk/lib/release/libdiscord_partner_sdk.so .

            - name: Save object cache
              if: always() && !cancelled()
              uses: actions/cache/save@v4
              with:
                  path: mame/build
                  key: ${{ steps.obj-cache.outputs.cache-primary-key }}

            - name: Stage artifact
              run: |
                  set -euo pipefail
                  cd mame
                  rm -Rf build .git src 3rdparty
                  ./mamehub -cc
                  mv mame.ini mame.ini.sample

            - name: Upload mame binary
              uses: actions/upload-artifact@v4
              with:
                  name: mamehub_ubuntu_beta
                  path: mame/*

    build_mac:
        runs-on: macos-latest

        steps:
            - name: Update OS
              run: brew install sdl3 sdl3_ttf openssl libsodium ccache

            - uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  path: "mame"

            - name: Cache compiler output
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: ${{ github.job }}-${{ runner.os }}
                  restore-keys: ${{ github.job }}-${{ runner.os }}
                  max-size: 4G
                  create-symlink: true
                  verbose: 1

            - name: Restore object cache
              id: obj-cache
              uses: actions/cache/restore@v4
              with:
                  path: mame/build
                  key: mamehub-obj-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
                  restore-keys: |
                      mamehub-obj-${{ runner.os }}-${{ github.job }}-

            - name: Restore source mtimes
              if: steps.obj-cache.outputs.cache-matched-key != ''
              working-directory: mame
              run: python3 scripts/mamehub/ci_restore_mtimes.py

            - name: make mame
              env:
                  OVERRIDE_CC: ccache clang
                  OVERRIDE_CXX: ccache clang++
                  GENIE_INPUT_HASH: ${{ hashFiles('mame/makefile', 'mame/scripts/**', 'mame/3rdparty/genie/src/**', 'mame/.github/workflows/build.yml') }}
              run: |
                  set -euo pipefail
                  cd mame
                  extra=($(bash scripts/mamehub/ci_regenie_args.sh))
                  make VERBOSE=1 -j4 "${extra[@]}"
                  bash scripts/mamehub/ci_regenie_args.sh --stamp
                  cp 3rdparty/discord_social_sdk/lib/release/libdiscord_partner_sdk.dylib .

            - name: Save object cache
              if: always() && !cancelled()
              uses: actions/cache/save@v4
              with:
                  path: mame/build
                  key: ${{ steps.obj-cache.outputs.cache-primary-key }}

            - name: Stage artifact
              run: |
                  set -euo pipefail
                  cd mame
                  rm -Rf build .git src 3rdparty
                  ./mamehub -cc
                  mv mame.ini mame.ini.sample

            - name: Upload mame binary
              uses: actions/upload-artifact@v4
              with:
                  name: mamehub_mac_beta
                  path: mame/*

    build_windows:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  path: "mame"

            - uses: actions/checkout@v4
              with:
                  repository: jedisct1/libsodium
                  ref: stable
                  path: "libsodium"

            - name: Install OpenSSL Full
              run: choco install openssl

            - uses: msys2/setup-msys2@v2
              with:
                  update: true

            - name: Cache compiler output
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: ${{ github.job }}-${{ runner.os }}
                  restore-keys: ${{ github.job }}-${{ runner.os }}
                  max-size: 4G
                  create-symlink: false
                  verbose: 1

            - name: Restore object cache
              id: obj-cache
              uses: actions/cache/restore@v4
              with:
                  path: mame/build
                  key: mamehub-obj-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
                  restore-keys: |
                      mamehub-obj-${{ runner.os }}-${{ github.job }}-

            - name: Restore source mtimes
              if: steps.obj-cache.outputs.cache-matched-key != ''
              working-directory: mame
              run: python scripts/mamehub/ci_restore_mtimes.py

            - name: Build
              shell: msys2 {0}
              env:
                  GENIE_INPUT_HASH: ${{ hashFiles('mame/makefile', 'mame/scripts/**', 'mame/3rdparty/genie/src/**', 'mame/.github/workflows/build.yml') }}
              run: |
                  pacman -Syu --noconfirm make mingw-w64-x86_64-python mingw-w64-x86_64-qt5 wget mingw-w64-x86_64-gcc mingw-w64-x86_64-ccache
                  if [[ -n "${CCACHE_DIR:-}" ]]; then
                    export CCACHE_DIR="$(cygpath -u "$CCACHE_DIR")"
                  fi
                  pushd libsodium && ./configure --enable-static --disable-shared && make && make install && popd
                  pushd mame
                  extra=($(bash scripts/mamehub/ci_regenie_args.sh))
                  MINGW64=/mingw64 OVERRIDE_CC='ccache gcc' OVERRIDE_CXX='ccache g++' make -j4 VERBOSE=1 "${extra[@]}"
                  bash scripts/mamehub/ci_regenie_args.sh --stamp
                  cp 3rdparty/discord_social_sdk/bin/release/discord_partner_sdk.dll .
                  popd

            - name: Save object cache
              if: always() && !cancelled()
              uses: actions/cache/save@v4
              with:
                  path: mame/build
                  key: ${{ steps.obj-cache.outputs.cache-primary-key }}

            - name: Stage artifact
              shell: msys2 {0}
              run: |
                  pushd mame
                  rm -Rf build .git src 3rdparty
                  ./mamehub.exe -cc
                  mv mame.ini mame.ini.sample
                  popd

            - name: Upload mame binary
              uses: actions/upload-artifact@v4
              with:
                  name: mamehub_windows_gcc_beta
                  path: mame/*

    build_windows_msvc:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  path: "mame"

            - uses: actions/checkout@v4
              with:
                  repository: jedisct1/libsodium
                  ref: stable
                  path: "libsodium"

            - name: Install OpenSSL Full
              run: choco install openssl

            - name: Add msbuild to PATH
              uses: microsoft/setup-msbuild@v2

            - uses: msys2/setup-msys2@v2
              with:
                  update: true

            - name: Cache compiler output
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: ${{ github.job }}-${{ runner.os }}
                  restore-keys: ${{ github.job }}-${{ runner.os }}
                  max-size: 4G
                  create-symlink: false
                  verbose: 1

            - name: Restore object cache
              id: obj-cache
              uses: actions/cache/restore@v4
              with:
                  path: mame/build
                  key: mamehub-obj-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
                  restore-keys: |
                      mamehub-obj-${{ runner.os }}-${{ github.job }}-

            - name: Restore source mtimes
              if: steps.obj-cache.outputs.cache-matched-key != ''
              working-directory: mame
              run: python scripts/mamehub/ci_restore_mtimes.py

            - name: Build
              shell: msys2 {0}
              env:
                  GENIE_INPUT_HASH: ${{ hashFiles('mame/makefile', 'mame/scripts/**', 'mame/3rdparty/genie/src/**', 'mame/.github/workflows/build.yml') }}
              run: |
                  pacman -Syu --noconfirm make mingw-w64-x86_64-python mingw-w64-x86_64-qt5 wget mingw-w64-x86_64-gcc mingw-w64-x86_64-ccache
                  if [[ -n "${CCACHE_DIR:-}" ]]; then
                    export CCACHE_DIR="$(cygpath -u "$CCACHE_DIR")"
                  fi
                  pushd libsodium && ./configure --enable-static --disable-shared && make && make install && popd
                  pushd mame
                  extra=($(bash scripts/mamehub/ci_regenie_args.sh))
                  MINGW64=/mingw64 OVERRIDE_CC='ccache gcc' OVERRIDE_CXX='ccache g++' make -j4 MSBUILD=1 VERBOSE=1 "${extra[@]}"
                  bash scripts/mamehub/ci_regenie_args.sh --stamp
                  cp 3rdparty/discord_social_sdk/bin/release/discord_partner_sdk.dll .
                  popd

            - name: Save object cache
              if: always() && !cancelled()
              uses: actions/cache/save@v4
              with:
                  path: mame/build
                  key: ${{ steps.obj-cache.outputs.cache-primary-key }}

            - name: Stage artifact
              shell: msys2 {0}
              run: |
                  pushd mame
                  rm -Rf build .git src 3rdparty
                  ./mamehub.exe -cc
                  mv mame.ini mame.ini.sample
                  popd

            - name: Upload mame binary
              uses: actions/upload-artifact@v4
              with:
                  name: mamehub_windows_msvc_beta
                  path: mame/*

    build_android:
        runs-on: ubuntu-22.04

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  path: "mame"

            - name: Require Discord Android SDK
              run: |
                  set -euo pipefail
                  SO="mame/3rdparty/discord_social_sdk/lib/release/android/arm64-v8a/libdiscord_partner_sdk.so"
                  AAR="mame/android-project/app/libs/discord_partner_sdk.aar"
                  if [[ ! -f "$SO" ]]; then
                    echo "Missing $SO — vendor Discord Social SDK Android arm64-v8a into 3rdparty (see 3rdparty/discord_social_sdk/README.mamehub.md)"
                    exit 1
                  fi
                  if [[ ! -f "$AAR" ]]; then
                    echo "Missing $AAR — copy discord_partner_sdk.aar into android-project/app/libs/"
                    exit 1
                  fi

            - name: Setup JDK
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"
                  cache: gradle
                  cache-dependency-path: mame/android-project/**/*.gradle*

            - name: Setup Android SDK / NDK
              uses: android-actions/setup-android@v3

            - name: Install NDK + build-tools
              run: |
                  set -euo pipefail
                  sdkmanager --install "ndk;27.0.12077973" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
                  echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
                  echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

            - name: Install host build deps
              run: sudo apt-get update -y && sudo apt-get install -y build-essential python3 cmake ninja-build curl rsync ccache

            - name: Cache compiler output
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: ${{ github.job }}-${{ runner.os }}
                  restore-keys: ${{ github.job }}-${{ runner.os }}
                  max-size: 4G
                  create-symlink: true
                  verbose: 1

            - name: Restore Android deps
              id: android-deps
              uses: actions/cache@v4
              with:
                  path: /tmp/mamehub-android-deps
                  key: mamehub-android-deps-${{ hashFiles('mame/tests/e2e/mamehub/build_android_deps.sh') }}

            - name: Restore object cache
              id: obj-cache
              uses: actions/cache/restore@v4
              with:
                  path: mame/build
                  key: mamehub-obj-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
                  restore-keys: |
                      mamehub-obj-${{ runner.os }}-${{ github.job }}-

            - name: Restore source mtimes
              if: steps.obj-cache.outputs.cache-matched-key != ''
              working-directory: mame
              run: python3 scripts/mamehub/ci_restore_mtimes.py

            - name: Build Android deps (OpenSSL / libsodium / SDL2)
              run: |
                  set -euo pipefail
                  chmod +x mame/tests/e2e/mamehub/build_android_deps.sh
                  mame/tests/e2e/mamehub/build_android_deps.sh
                  echo "ANDROID_OPENSSL_ROOT=/tmp/mamehub-android-deps/openssl-arm64" >> "$GITHUB_ENV"
                  echo "ANDROID_SODIUM_ROOT=/tmp/mamehub-android-deps/libsodium-arm64" >> "$GITHUB_ENV"
                  echo "SDL_INSTALL_ROOT=/tmp/mamehub-android-deps/sdl-arm64" >> "$GITHUB_ENV"

            - name: Cross-compile libmainhub.so (android-arm64)
              env:
                  GENIE_INPUT_HASH: ${{ hashFiles('mame/makefile', 'mame/scripts/**', 'mame/3rdparty/genie/src/**', 'mame/.github/workflows/build.yml') }}
              run: |
                  set -euo pipefail
                  cd mame
                  extra=($(bash scripts/mamehub/ci_regenie_args.sh))
                  NDK_CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
                  NDK_CLANGXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
                  make android-arm64 CONFIG=release NOWERROR=1 -j4 \
                    OVERRIDE_CC="ccache ${NDK_CLANG}" \
                    OVERRIDE_CXX="ccache ${NDK_CLANGXX}" \
                    "${extra[@]}"
                  bash scripts/mamehub/ci_regenie_args.sh --stamp
                  test -f android-project/app/src/main/libs/arm64-v8a/libmainhub.so

            - name: Save object cache
              if: always() && !cancelled()
              uses: actions/cache/save@v4
              with:
                  path: mame/build
                  key: ${{ steps.obj-cache.outputs.cache-primary-key }}

            - name: Assemble debug APK
              run: |
                  set -euo pipefail
                  cd mame/android-project
                  chmod +x gradlew
                  ./gradlew assembleDebug --no-daemon
                  test -f app/build/outputs/apk/debug/app-debug.apk

            - name: Stage APK
              run: |
                  set -euo pipefail
                  cp mame/android-project/app/build/outputs/apk/debug/app-debug.apk \
                    mamehub_android_arm64_beta.apk

            - name: Upload Android APK
              uses: actions/upload-artifact@v4
              with:
                  name: mamehub_android_arm64_beta.apk
                  path: mamehub_android_arm64_beta.apk
                  if-no-files-found: error

    build_ios:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  path: "mame"

            - name: Require Discord iOS SDK
              run: |
                  set -euo pipefail
                  XC="mame/3rdparty/discord_social_sdk/lib/release/discord_partner_sdk.xcframework"
                  if [[ ! -d "$XC/ios-arm64-simulator" || ! -d "$XC/ios-arm64" ]]; then
                    echo "Missing $XC — vendor Discord Social SDK xcframework into 3rdparty (see 3rdparty/discord_social_sdk/README.mamehub.md)"
                    exit 1
                  fi

            - name: Install host deps
              run: brew install cmake rsync ccache || true

            - name: Cache compiler output
              uses: hendrikmuhs/ccache-action@v1.2
              with:
                  key: ${{ github.job }}-${{ runner.os }}
                  restore-keys: ${{ github.job }}-${{ runner.os }}
                  max-size: 4G
                  create-symlink: true
                  verbose: 1

            - name: Restore iOS deps
              id: ios-deps
              uses: actions/cache@v4
              with:
                  path: /tmp/mamehub-ios-deps
                  key: mamehub-ios-deps-${{ hashFiles('mame/tests/e2e/mamehub/build_ios_deps.sh') }}

            - name: Restore object cache
              id: obj-cache
              uses: actions/cache/restore@v4
              with:
                  path: mame/build
                  key: mamehub-obj-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
                  restore-keys: |
                      mamehub-obj-${{ runner.os }}-${{ github.job }}-

            - name: Restore source mtimes
              if: steps.obj-cache.outputs.cache-matched-key != ''
              working-directory: mame
              run: python3 scripts/mamehub/ci_restore_mtimes.py

            - name: Build iOS simulator deps (OpenSSL / libsodium / SDL2)
              run: |
                  set -euo pipefail
                  chmod +x mame/tests/e2e/mamehub/build_ios_deps.sh
                  mame/tests/e2e/mamehub/build_ios_deps.sh
                  {
                    echo "IOS_OPENSSL_ROOT=/tmp/mamehub-ios-deps/openssl-sim-arm64"
                    echo "IOS_SODIUM_ROOT=/tmp/mamehub-ios-deps/libsodium-sim-arm64"
                    echo "SDL_INSTALL_ROOT=/tmp/mamehub-ios-deps/sdl-sim-arm64"
                  } >> "$GITHUB_ENV"

            - name: Cross-compile + package iOS Simulator app
              env:
                  GENIE_INPUT_HASH: ${{ hashFiles('mame/makefile', 'mame/scripts/**', 'mame/3rdparty/genie/src/**', 'mame/.github/workflows/build.yml') }}
              run: |
                  set -euo pipefail
                  cd mame
                  extra=($(bash scripts/mamehub/ci_regenie_args.sh))
                  CLANG="$(xcrun --sdk iphonesimulator -f clang)"
                  CLANGXX="$(xcrun --sdk iphonesimulator -f clang++)"
                  make ios-simulator CONFIG=release NOWERROR=1 -j4 \
                    OVERRIDE_CC="ccache ${CLANG}" \
                    OVERRIDE_CXX="ccache ${CLANGXX}" \
                    "${extra[@]}"
                  bash scripts/mamehub/ci_regenie_args.sh --stamp
                  chmod +x ios-project/package_app.sh
                  ./ios-project/package_app.sh
                  test -d ios-project/build/ios-simulator/MAMEHub.app

            - name: Save object cache
              if: always() && !cancelled()
              uses: actions/cache/save@v4
              with:
                  path: mame/build
                  key: ${{ steps.obj-cache.outputs.cache-primary-key }}

            - name: Stage artifact
              run: |
                  set -euo pipefail
                  mkdir -p out
                  ditto -c -k --sequesterRsrc --keepParent \
                    mame/ios-project/build/ios-simulator/MAMEHub.app \
                    out/MAMEHub-ios-simulator.zip

            - name: Upload iOS Simulator app
              uses: actions/upload-artifact@v4
              with:
                  name: mamehub_ios_simulator_beta
                  path: out/*
