apply plugin: 'com.android.application'

android {
    namespace 'org.mamedev.mame'
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "org.mamedev.mame"
        minSdkVersion 24
        targetSdkVersion 36
        ndk {
            moduleName 'main'
        }
    }

    lintOptions {
        abortOnError false
    }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDir 'src/main/libs'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}

dependencies {
    implementation files('libs/discord_partner_sdk.aar')
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.core:core:1.13.1'
}

task copyFiles_bgfx(type: Copy)
task copyFiles_language(type: Copy)

copyFiles_bgfx {
    from '../../bgfx'
    into 'src/main/assets/bgfx'
    include('**/*')
}
copyFiles_language {
    from '../../language'
    into 'src/main/assets/language'
    include('**/*.mo')
}

preBuild.dependsOn copyFiles_bgfx
preBuild.dependsOn copyFiles_language
